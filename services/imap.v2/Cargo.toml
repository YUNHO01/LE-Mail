[package]
name = "lemail-imap"
version = "2.0.0"
edition = "2021"
description = "LEMail IMAP4rev1 Microservice (Rust v2)"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
bytes = "1"

# Phase 2: DB, Redis, Auth, License
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql", "chrono"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
futures-util = "0.3"
bcrypt = "0.17"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

# Phase 4: MIME / RFC 2047 parsing for APPEND
mail-parser = "0.9"
